services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: usperdi
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d usperdi"]
      interval: 5s
      timeout: 5s
      retries: 5
  api_service:
    build: ./backend
    restart: always
    ports:
      - 8080:8080
    environment:
      DATABASE_URL: "jdbc:postgresql://postgres:5432/usperdi"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      DEFAULT_USER_PHOTO: ${DEFAULT_USER_PHOTO:-https://cdn.jsdelivr.net/gh/devicons/devicon/icons/github/github-original.svg}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/uploads

volumes:
  postgres_data: