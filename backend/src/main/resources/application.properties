spring.application.name=usperdi
auth.google.client-id=${GOOGLE_CLIENT_ID:}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ==============
# BANCO DE DADOS
# ==============

# Por enquanto as credenciais estao hardcoded, depois tem que colocar num .env file

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/usperdi}
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# nao deixa o banco perder conexao

spring.datasource.testWhileIdle=true
spring.datasource.validationQuery=SELECT 1


# ===========
# HEALTHCHECK
# ===========

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.health.db.enabled=true

# Upload de imagens
app.uploads-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
